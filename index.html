<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Strategy Idea Tracker · editoz.club</title>
<style>
  :root{
    --bg:#f5f6f8; --card-bg:#ffffff; --text:#14171a; --text-muted:#6b7280; --border:#e6e8eb;
    --blue:#2f6fed; --blue-bg:#eaf1fe; --green:#16a34a; --green-bg:#eafbf0;
    --red:#dc2626; --red-bg:#fdecec; --amber:#b45309; --amber-bg:#fef3e2;
    --gray-chip-bg:#eef0f2; --gray-chip-text:#4b5563; --purple:#7c3aed; --purple-bg:#f3ecfd;
    --teal:#0d9488; --teal-bg:#e6f7f5;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 4px 10px rgba(16,24,40,.05);
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); box-sizing:border-box;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#101214; --card-bg:#181b1f; --text:#f2f3f5; --text-muted:#9aa1ab; --border:#2a2e33;
      --blue-bg:#182842; --green-bg:#122a1c; --red-bg:#331515; --amber-bg:#332108;
      --gray-chip-bg:#25282c; --gray-chip-text:#c2c7cd; --purple-bg:#241a38; --teal-bg:#0c2725;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#101214;--card-bg:#181b1f;--text:#f2f3f5;--text-muted:#9aa1ab;--border:#2a2e33;
    --blue-bg:#182842;--green-bg:#122a1c;--red-bg:#331515;--amber-bg:#332108;
    --gray-chip-bg:#25282c;--gray-chip-text:#c2c7cd;--purple-bg:#241a38;--teal-bg:#0c2725;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.35);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
  header.topbar{display:flex;align-items:center;gap:14px;padding:14px 24px;padding-top:calc(14px + env(safe-area-inset-top,0px));background:var(--card-bg);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;flex-wrap:wrap;}
  .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;white-space:nowrap;}
  .logo .mark{width:16px;height:16px;background:var(--text);border-radius:4px;transform:rotate(45deg);}
  nav.tabs{display:flex;gap:4px;background:var(--gray-chip-bg);padding:4px;border-radius:10px;}
  nav.tabs button{border:none;background:transparent;padding:7px 14px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--text-muted);cursor:pointer;}
  nav.tabs button.active{background:var(--blue);color:#fff;}
  .spacer{flex:1;}
  input#search{border:1px solid var(--border);background:var(--bg);border-radius:8px;padding:7px 12px;font-size:13px;color:var(--text);min-width:160px;}
  .snapshot-pill{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-muted);background:var(--gray-chip-bg);padding:6px 10px;border-radius:999px;white-space:nowrap;}
  .snapshot-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--green);}
  .snapshot-pill.stale .dot{background:var(--amber);}
  .refresh-btn{border:1px solid var(--border);background:var(--card-bg);border-radius:8px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-muted);font-size:14px;}
  .refresh-btn:disabled{opacity:.5;cursor:default;}
  main{max-width:1180px;margin:0 auto;padding:20px 24px 60px;}
  .banner{display:flex;flex-direction:column;gap:10px;background:var(--red-bg);border:1px solid rgba(220,38,38,.25);border-radius:14px;padding:14px 18px;margin-bottom:20px;}
  .banner-title{font-weight:700;font-size:14.5px;color:var(--red);}
  .banner-chips{display:flex;flex-wrap:wrap;gap:8px;}
  .banner-chip{background:var(--card-bg);border:1px solid rgba(220,38,38,.2);border-radius:9px;padding:6px 10px;font-size:12.5px;}
  .banner-chip b{color:var(--red);}
  .error-banner{background:var(--amber-bg);border:1px solid rgba(180,83,9,.25);border-radius:14px;padding:12px 16px;margin-bottom:16px;font-size:12.5px;color:var(--amber);}
  .overall-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:22px;}
  .stat-card{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:14px 18px;box-shadow:var(--shadow);min-width:130px;flex:1;}
  .stat-card .num{font-size:26px;font-weight:700;}
  .stat-card .label{font-size:12px;color:var(--text-muted);margin-top:2px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;}
  .card{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:var(--shadow);}
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .client-id{display:flex;align-items:center;gap:10px;min-width:0;}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--blue-bg);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13.5px;flex-shrink:0;}
  .client-name{font-weight:700;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .client-meta{font-size:12px;color:var(--text-muted);margin-top:1px;}
  .status-pill{padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;flex-shrink:0;}
  .status-pill.risk{background:var(--red-bg);color:var(--red);}
  .status-pill.ontrack{background:var(--green-bg);color:var(--green);}
  .status-pill.empty{background:var(--gray-chip-bg);color:var(--gray-chip-text);}
  .pct-row{display:flex;align-items:baseline;gap:8px;margin-top:14px;}
  .pct-row .pct{font-size:30px;font-weight:800;}
  .pct-row .pct-sub{font-size:12.5px;color:var(--text-muted);}
  .bar-track{height:8px;background:var(--gray-chip-bg);border-radius:99px;margin-top:10px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--green);border-radius:99px;}
  .idea-list{margin-top:16px;display:flex;flex-direction:column;gap:8px;max-height:260px;overflow-y:auto;}
  .idea-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;background:var(--bg);border-radius:10px;border:1px solid var(--border);text-decoration:none;color:inherit;transition:border-color .12s;}
  .idea-row:hover{border-color:var(--blue);}
  .idea-name{font-size:13px;line-height:1.3;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .idea-tags{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .chip{padding:3px 8px;border-radius:7px;font-size:11px;font-weight:700;white-space:nowrap;}
  .chip.gray{background:var(--gray-chip-bg);color:var(--gray-chip-text);}
  .chip.progress{background:var(--blue-bg);color:var(--blue);}
  .chip.almost{background:var(--teal-bg);color:var(--teal);}
  .chip.published{background:var(--green-bg);color:var(--green);}
  .chip.excluded{background:var(--purple-bg);color:var(--purple);}
  .daychip{font-size:11px;font-weight:700;}
  .daychip.over{color:var(--red);}
  .daychip.left{color:var(--text-muted);}
  section.view{display:none;}
  section.view.active{display:block;}
  .bn-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px;}
  .bn-panels{display:grid;grid-template-columns:1.1fr 1.4fr;gap:16px;}
  @media (max-width:820px){.bn-panels{grid-template-columns:1fr;}}
  .panel{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:var(--shadow);}
  .panel h3{margin:0 0 14px;font-size:13px;letter-spacing:.02em;color:var(--text-muted);font-weight:700;}
  .legend-row{display:flex;align-items:center;justify-content:space-between;font-size:13px;margin-top:8px;}
  .legend-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:8px;}
  .sev-row{margin-bottom:12px;}
  .sev-label{font-size:12.5px;margin-bottom:4px;display:flex;justify-content:space-between;}
  .sev-bar-track{height:9px;background:var(--gray-chip-bg);border-radius:99px;overflow:hidden;}
  .sev-bar-fill{height:100%;border-radius:99px;}
  footer.note{margin-top:26px;padding:14px 18px;border:1px dashed var(--border);border-radius:12px;font-size:12.5px;color:var(--text-muted);line-height:1.6;}
  .loading, .fatal{padding:60px 20px;text-align:center;color:var(--text-muted);}
  .fatal{color:var(--red);}
</style>
</head>
<body>

<header class="topbar">
  <div class="logo"><span class="mark"></span> editoz.club <span style="font-weight:500;color:var(--text-muted);font-size:13px;">/ strategy ideas</span></div>
  <nav class="tabs">
    <button class="active" data-view="overview">Overview</button>
    <button data-view="bottleneck">Bottleneck</button>
  </nav>
  <input id="search" placeholder="Filter clients…" />
  <div class="spacer"></div>
  <div class="snapshot-pill" id="snapshotPill"><span class="dot"></span> <span id="snapshotText">Loading…</span></div>
  <button class="refresh-btn" id="refreshBtn" title="Re-pull from Notion now">⟳</button>
</header>

<main id="main">
  <div class="loading">Pulling live data from Notion…</div>
</main>

<script>
function initials(name){ return name.split(" ").filter(Boolean).map(w=>w[0]).slice(0,2).join("").toUpperCase(); }

function chipClassAndLabel(idea){
  if(idea.excluded) return {cls:"excluded", label: idea.status || "Excluded"};
  if(idea.executed) return {cls:"published", label:"Published"};
  if(idea.bucket==="almost") return {cls:"almost", label: idea.status};
  if(idea.bucket==="progress") return {cls:"progress", label: idea.status};
  return {cls:"gray", label: idea.status || "Topics"};
}

let REPORT = null;
let currentView = "overview";
let filterText = "";

async function load(force){
  const btn = document.getElementById("refreshBtn");
  btn.disabled = true;
  try{
    const res = await fetch("/api/strategy-ideas" + (force ? "?force=1" : ""));
    const data = await res.json();
    if(!res.ok){ throw new Error(data.error || "Request failed"); }
    REPORT = data;
    render();
  }catch(e){
    document.getElementById("main").innerHTML = `<div class="fatal">Couldn't load data: ${e.message}<br/><br/>Check that NOTION_TOKEN is set in this project's environment variables.</div>`;
  }finally{
    btn.disabled = false;
  }
}

function render(){
  if(!REPORT) return;
  const pill = document.getElementById("snapshotPill");
  const asOf = new Date(REPORT.asOf);
  document.getElementById("snapshotText").textContent = "Live · pulled " + asOf.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  pill.classList.remove("stale");

  const allClients = REPORT.clients.filter(c => c.stats.suggested > 0);
  const visibleClients = allClients.filter(c => c.name.toLowerCase().includes(filterText.toLowerCase()));
  const allIdeas = allClients.flatMap(c => c.ideas.map(i => ({...i, client:c.name})));

  let html = "";

  if(REPORT.errors && REPORT.errors.length){
    html += `<div class="error-banner">⚠ Couldn't load ${REPORT.errors.length} client board(s): ${REPORT.errors.map(e=>e.client).join(", ")}. Usually means this Notion integration hasn't been shared with that client's Content Board page yet.</div>`;
  }

  const overdueIdeas = allIdeas.filter(i=>i.overdue);
  if(overdueIdeas.length){
    html += `<div class="banner">
      <div class="banner-title">⚠ ${overdueIdeas.length} ideas are past their 7-day check-by date and still not Published</div>
      <div class="banner-chips">
        ${overdueIdeas.slice(0,30).map(i=>`<div class="banner-chip"><b>${Math.abs(i.daysLeft)}d overdue</b> · ${i.client} · ${i.name} · currently ${i.status||"Topics"}</div>`).join("")}
        ${overdueIdeas.length>30 ? `<div class="banner-chip">+${overdueIdeas.length-30} more</div>`:""}
      </div></div>`;
  }

  const o = REPORT.overall;
  html += `<div class="overall-row">
    <div class="stat-card"><div class="num">${o.clientsWithIdeas}</div><div class="label">Clients with ⭐ ideas</div></div>
    <div class="stat-card"><div class="num">${o.totalSuggested}</div><div class="label">Ideas suggested</div></div>
    <div class="stat-card"><div class="num">${o.pct==null?'—':o.pct+'%'}</div><div class="label">Overall execution rate</div></div>
    <div class="stat-card"><div class="num" style="color:var(--red)">${o.totalOverdue}</div><div class="label">Past check-by, still not done</div></div>
  </div>`;

  html += `<section class="view ${currentView==='overview'?'active':''}" id="view-overview"><div class="grid">`;
  visibleClients.forEach(c=>{
    const {suggested, executed, excluded, overdue, pct} = c.stats;
    const risk = overdue > 0;
    const rows = c.ideas.map(i=>{
      const ch = chipClassAndLabel(i);
      let dayHtml;
      if(i.excluded) dayHtml = `<span class="daychip left">excluded</span>`;
      else if(i.executed) dayHtml = `<span class="daychip left">done</span>`;
      else if(i.daysLeft < 0) dayHtml = `<span class="daychip over">${Math.abs(i.daysLeft)}d overdue</span>`;
      else dayHtml = `<span class="daychip left">${i.daysLeft}d left</span>`;
      return `<a class="idea-row" href="${i.url}" target="_blank" rel="noopener noreferrer">
        <div class="idea-name" title="${i.name}">${i.name}</div>
        <div class="idea-tags"><span class="chip ${ch.cls}">${ch.label}</span>${dayHtml}</div>
      </a>`;
    }).join("");

    html += `<div class="card">
      <div class="card-head">
        <div class="client-id">
          <div class="avatar">${initials(c.name)}</div>
          <div style="min-width:0;">
            <div class="client-name" title="${c.name}">${c.name}</div>
            <div class="client-meta">${c.projectType||""}${c.po? ' · PO: '+c.po : ''}</div>
          </div>
        </div>
        <span class="status-pill ${risk?'risk':'ontrack'}">${risk? overdue+' overdue' : 'On track'}</span>
      </div>
      <div class="pct-row">
        <span class="pct">${pct==null?'—':pct+'%'}</span>
        <span class="pct-sub">${executed}/${suggested-excluded} executed${excluded? ' · '+excluded+' excluded':''}</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct||0}%"></div></div>
      <div class="idea-list">${rows}</div>
    </div>`;
  });
  html += `</div></section>`;

  const notDue = allIdeas.filter(i=>!i.executed && !i.excluded && i.daysLeft>=0).length;
  const overdueInProgress = allIdeas.filter(i=>i.overdue && i.bucket!=="gray").length;
  const overdueStalled = allIdeas.filter(i=>i.overdue && i.bucket==="gray").length;
  const published = allIdeas.filter(i=>i.executed).length;

  html += `<section class="view ${currentView==='bottleneck'?'active':''}" id="view-bottleneck">
    <div class="bn-top">
      <div class="stat-card"><div class="num">${allClients.length}</div><div class="label">Clients with ideas</div></div>
      <div class="stat-card"><div class="num" style="color:var(--red)">${overdueStalled}</div><div class="label">Overdue &amp; not started</div></div>
      <div class="stat-card"><div class="num" style="color:var(--amber)">${overdueInProgress}</div><div class="label">Overdue &amp; in motion</div></div>
      <div class="stat-card"><div class="num" style="color:var(--green)">${published}</div><div class="label">Published</div></div>
    </div>
    <div class="bn-panels">
      <div class="panel"><h3>WHERE ALL IDEAS STAND</h3><div id="donutWrap" style="display:flex;justify-content:center;"></div><div id="donutLegend"></div></div>
      <div class="panel"><h3>OVERDUE IDEAS BY CLIENT</h3><div id="severity"></div></div>
    </div>
  </section>`;

  document.getElementById("main").innerHTML = html;

  const segs = [
    {label:"Not due yet", value: notDue, color:"#9aa1ab"},
    {label:"Overdue, in progress", value: overdueInProgress, color:"#b45309"},
    {label:"Overdue, not started", value: overdueStalled, color:"#dc2626"},
    {label:"Published", value: published, color:"#16a34a"}
  ].filter(s=>s.value>0);
  const total = segs.reduce((a,s)=>a+s.value,0) || 1;
  const r=64, cx=80, cy=80, circ=2*Math.PI*r;
  let offset=0, arcs="";
  segs.forEach(s=>{
    const len=(s.value/total)*circ;
    arcs += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="20" stroke-dasharray="${len} ${circ-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
    offset += len;
  });
  const donutWrap = document.getElementById("donutWrap");
  if(donutWrap){
    donutWrap.innerHTML = `<svg width="160" height="160" viewBox="0 0 160 160">${arcs}
      <text x="80" y="76" text-anchor="middle" font-size="26" font-weight="800" fill="var(--text)">${total}</text>
      <text x="80" y="94" text-anchor="middle" font-size="11" fill="var(--text-muted)">ideas</text></svg>`;
    document.getElementById("donutLegend").innerHTML = segs.map(s=>`<div class="legend-row"><span><span class="legend-dot" style="background:${s.color}"></span>${s.label}</span><b>${s.value}</b></div>`).join("");
  }

  const sevEl = document.getElementById("severity");
  if(sevEl){
    const byClient = allClients.map(c=>({name:c.name, count:c.stats.overdue})).sort((a,b)=>b.count-a.count);
    const shown = byClient.filter(c=>c.count>0).slice(0,12);
    const rest = byClient.length - shown.length;
    const max = Math.max(1, ...shown.map(c=>c.count));
    sevEl.innerHTML = (shown.length ? shown.map(c=>`
      <div class="sev-row"><div class="sev-label"><span>${c.name}</span><span>${c.count}</span></div>
      <div class="sev-bar-track"><div class="sev-bar-fill" style="width:${(c.count/max)*100}%; background:#dc2626"></div></div></div>
    `).join("") : `<div style="color:var(--text-muted);font-size:13px;">Nothing overdue right now.</div>`)
    + (rest>0 ? `<div style="color:var(--text-muted);font-size:12px;margin-top:8px;">+${rest} more clients, all on track</div>` : "");
  }

  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("active", b.dataset.view===currentView));
}

document.querySelectorAll("nav.tabs button").forEach(btn=>{
  btn.addEventListener("click", ()=>{ currentView = btn.dataset.view; render(); });
});
document.getElementById("search").addEventListener("input", (e)=>{ filterText = e.target.value; render(); });
document.getElementById("refreshBtn").addEventListener("click", ()=>load(true));

load(false);
</script>

</body>
</html>
